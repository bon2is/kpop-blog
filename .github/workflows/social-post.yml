name: Social Media Auto-Post

on:
  push:
    branches:
      - main
    paths:
      - 'content/posts/*.md'

jobs:
  post-social:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run social post script
        continue-on-error: true
        env:
          TWITTER_APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
          TWITTER_APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          NEXT_PUBLIC_SITE_URL: https://kpop.andxo.com
        run: npx ts-node --compiler-options '{"module":"commonjs"}' scripts/post-social.ts

      - name: Commit tracking files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/.twitter-posted.json content/.pinterest-posted.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update social media tracking files [skip ci]"
          git pull --rebase origin main || true
          git push
