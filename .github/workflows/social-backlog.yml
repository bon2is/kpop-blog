name: Post Backlog to Social Media

on:
  # Run 4 times daily at different times for global reach
  schedule:
    # 07:00 KST (22:00 UTC prev day) - US Afternoon
    - cron: '0 22 * * *'
    # 12:00 KST (03:00 UTC) - US Night / Europe Morning
    - cron: '0 3 * * *'
    # 18:00 KST (09:00 UTC) - Europe Afternoon / US Early Morning
    - cron: '0 9 * * *'
    # 22:00 KST (13:00 UTC) - US Morning / SEA Evening
    - cron: '0 13 * * *'
  # Allow manual trigger
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  post-backlog:
    runs-on: ubuntu-latest
    concurrency:
      group: social-posting
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # NOTE: Threads posting is intentionally excluded from backlog.
      # Threads is handled exclusively by fetch-and-deploy.yml to prevent
      # duplicate posts caused by tracker race conditions between workflows.
      - name: Post backlog articles to Twitter and Bluesky
        env:
          TWITTER_APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
          TWITTER_APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          NEXT_PUBLIC_SITE_URL: https://kpop.andxo.com
        run: npm run post-backlog

      - name: Post to Pinterest
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          NEXT_PUBLIC_SITE_URL: https://kpop.andxo.com
        run: npm run post-pinterest
        continue-on-error: true

      - name: Commit updated posted lists
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/.twitter-posted.json content/.bluesky-posted.json content/.pinterest-posted.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update social media posted lists"
          # Pull latest before pushing to avoid non-fast-forward rejection
          git pull --rebase origin main || true
          git push

      - name: Summary
        if: always()
        run: |
          echo "## Social Media Backlog Posting" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backlog posting completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** Twitter/X, Bluesky, Pinterest (Threads handled by fetch-and-deploy)" >> $GITHUB_STEP_SUMMARY
          echo "**Schedule:** 4x daily (07:00, 12:00, 18:00, 22:00 KST)" >> $GITHUB_STEP_SUMMARY
          echo "**Posts per run:** 2 articles per platform" >> $GITHUB_STEP_SUMMARY
