name: Fetch News & Deploy

on:
  # 4x daily for global coverage
  schedule:
    # 10:00 KST (01:00 UTC) - US Evening / KST Morning
    - cron: '0 1 * * *'
    # 14:00 KST (05:00 UTC) - Europe Morning / KST Afternoon
    - cron: '0 5 * * *'
    # 20:00 KST (11:00 UTC) - Europe Afternoon / KST Evening
    - cron: '0 11 * * *'
    # 23:00 KST (14:00 UTC) - US Morning / KST Night
    - cron: '0 14 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Maximum articles to fetch (default: 10)'
        required: false
        default: '10'

env:
  NODE_VERSION: '20'

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    # Prevent concurrent runs to avoid duplicate articles
    concurrency:
      group: fetch-news
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch news articles with AI content
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MAX_ARTICLES: ${{ github.event.inputs.max_articles || '5' }}
        run: npm run fetch-news
        timeout-minutes: 15

      - name: Update music charts
        run: npm run fetch-charts
        timeout-minutes: 5
        continue-on-error: true

      - name: Fetch idol schedule
        run: npm run fetch-schedule
        timeout-minutes: 5
        continue-on-error: true

      - name: Generate RSS feed and News sitemap
        run: npm run generate-feeds
        timeout-minutes: 2
        continue-on-error: true

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet content/ public/data/ public/feed.xml public/news-sitemap.xml public/schedule.json 2>/dev/null; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit new articles and images
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Add content, images, chart data, and feeds
          git add content/ public/images/posts/ public/data/ public/feed.xml public/news-sitemap.xml public/schedule.json

          # Count new articles
          NEW_COUNT=$(git diff --cached --name-only | grep -c "content/posts/" || echo "0")
          CHART_CHANGED=$(git diff --cached --name-only | grep -c "public/data/charts.json" || echo "0")

          if [ "$CHART_CHANGED" -gt "0" ]; then
            CHART_MSG=" + charts updated"
          else
            CHART_MSG=""
          fi

          git commit -m "Auto-update: ${NEW_COUNT} new article(s) with thumbnails${CHART_MSG}" || exit 0

          git pull --rebase origin main || true
          git push


      - name: Deploy to Vercel
        if: steps.git-check.outputs.changes == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: npx vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        timeout-minutes: 25

      - name: Post to Threads
        if: steps.git-check.outputs.changes == 'true'
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          NEXT_PUBLIC_SITE_URL: https://kpop.andxo.com
        run: npm run post-threads
        continue-on-error: true

      - name: Post to Twitter
        if: steps.git-check.outputs.changes == 'true'
        env:
          TWITTER_APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
          TWITTER_APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          NEXT_PUBLIC_SITE_URL: https://kpop.andxo.com
        run: npm run post-twitter
        continue-on-error: true

      - name: Post to Bluesky
        if: steps.git-check.outputs.changes == 'true'
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          NEXT_PUBLIC_SITE_URL: https://kpop.andxo.com
        run: npm run post-bluesky
        continue-on-error: true

      - name: Post to Pinterest
        if: steps.git-check.outputs.changes == 'true'
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          NEXT_PUBLIC_SITE_URL: https://kpop.andxo.com
        run: npm run post-pinterest
        continue-on-error: true

      - name: Post to Discord
        if: steps.git-check.outputs.changes == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEXT_PUBLIC_SITE_URL: https://kpop.andxo.com
        run: npm run post-discord
        continue-on-error: true

      - name: Commit social tracking files
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git add content/.threads-posted.json content/.twitter-posted.json content/.bluesky-posted.json content/.pinterest-posted.json content/.discord-posted.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update social media posted lists"
          # Retry push up to 3 times to ensure Threads tracker is always persisted
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done

      - name: Summary
        if: always()
        env:
          HAS_CHANGES: ${{ steps.git-check.outputs.changes }}
        run: |
          echo "## Fetch News Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$HAS_CHANGES" == "true" ]; then
            echo "New articles fetched and committed" >> $GITHUB_STEP_SUMMARY
            echo "Posted to social media (if configured)" >> $GITHUB_STEP_SUMMARY
          else
            echo "No new articles to fetch" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Sources:** Soompi, Koreaboo, Korea Herald" >> $GITHUB_STEP_SUMMARY
          echo "**Social:** Threads, Twitter/X, Bluesky, Pinterest, Discord auto-posting" >> $GITHUB_STEP_SUMMARY

  # Deploy to GitHub Pages (optional - uncomment if using)
  # deploy:
  #   needs: fetch-and-build
  #   runs-on: ubuntu-latest
  #   if: success()
  #   permissions:
  #     pages: write
  #     id-token: write
  #   environment:
  #     name: github-pages
  #     url: ${{ steps.deployment.outputs.page_url }}
  #   steps:
  #     - name: Deploy to GitHub Pages
  #       id: deployment
  #       uses: actions/deploy-pages@v4

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: fetch-and-build
    if: failure()
    steps:
      - name: Create failure summary
        run: |
          echo "## ❌ Workflow Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The news fetch workflow failed. Check the logs for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Common issues:**" >> $GITHUB_STEP_SUMMARY
          echo "- OpenAI API rate limits" >> $GITHUB_STEP_SUMMARY
          echo "- RSS source unavailable" >> $GITHUB_STEP_SUMMARY
          echo "- Image generation timeout" >> $GITHUB_STEP_SUMMARY
