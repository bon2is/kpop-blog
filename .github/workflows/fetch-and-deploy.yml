name: Fetch News & Deploy

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  # Allow manual trigger
  workflow_dispatch:
  # Run on push to main (for initial setup)
  push:
    branches:
      - main

env:
  NODE_VERSION: '20'

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and rewrite news articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run fetch-news

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet content/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit new articles
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/
          git commit -m "Auto-update: New articles" || exit 0
          git push

      - name: Build site
        run: npm run build

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: fetch-and-build
    if: failure()
    steps:
      - name: Notify failure
        run: |
          echo "News fetch workflow failed!"
