name: Fetch News & Deploy

on:
  # Run daily at 20:00 KST (11:00 UTC)
  schedule:
    - cron: '0 11 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Maximum articles to fetch (default: 10)'
        required: false
        default: '10'

env:
  NODE_VERSION: '20'

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    # Prevent concurrent runs to avoid duplicate articles
    concurrency:
      group: fetch-news
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch news articles with AI content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run fetch-news
        timeout-minutes: 15

      - name: Check for changes
        id: git-check
        run: |
          # Check both content and images directories
          if git diff --quiet content/ public/images/posts/ 2>/dev/null; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No new articles"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "New articles found"
          fi

      - name: Commit new articles and images
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Add content and images
          git add content/ public/images/posts/

          # Count new articles
          NEW_COUNT=$(git diff --cached --name-only | grep -c "content/posts/" || echo "0")

          # Commit with article count
          git commit -m "Auto-update: ${NEW_COUNT} new article(s) with AI thumbnails

          Generated with DALL-E 3 (Studio Ghibli style)
          Images optimized to WebP format" || exit 0

          git push

      - name: Post to Threads
        if: steps.git-check.outputs.changes == 'true'
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          NEXT_PUBLIC_SITE_URL: https://kpop.andxo.com
        run: npm run post-threads
        continue-on-error: true

      - name: Build site
        run: npm run build

      - name: Summary
        if: always()
        env:
          HAS_CHANGES: ${{ steps.git-check.outputs.changes }}
        run: |
          echo "## Fetch News Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$HAS_CHANGES" == "true" ]; then
            echo "✅ New articles fetched and committed" >> $GITHUB_STEP_SUMMARY
            echo "✅ Posted to Threads (if configured)" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No new articles to fetch" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Sources:** Soompi, Koreaboo, Korea Herald" >> $GITHUB_STEP_SUMMARY
          echo "**Social:** Threads auto-posting enabled" >> $GITHUB_STEP_SUMMARY

  # Deploy to GitHub Pages (optional - uncomment if using)
  # deploy:
  #   needs: fetch-and-build
  #   runs-on: ubuntu-latest
  #   if: success()
  #   permissions:
  #     pages: write
  #     id-token: write
  #   environment:
  #     name: github-pages
  #     url: ${{ steps.deployment.outputs.page_url }}
  #   steps:
  #     - name: Deploy to GitHub Pages
  #       id: deployment
  #       uses: actions/deploy-pages@v4

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: fetch-and-build
    if: failure()
    steps:
      - name: Create failure summary
        run: |
          echo "## ❌ Workflow Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The news fetch workflow failed. Check the logs for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Common issues:**" >> $GITHUB_STEP_SUMMARY
          echo "- OpenAI API rate limits" >> $GITHUB_STEP_SUMMARY
          echo "- RSS source unavailable" >> $GITHUB_STEP_SUMMARY
          echo "- Image generation timeout" >> $GITHUB_STEP_SUMMARY
